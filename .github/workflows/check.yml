name: checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: qualifier_test
          POSTGRES_USER: qualifier
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qualifier -d qualifier_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://qualifier:ci-password@localhost:5432/qualifier_test
      EXTRACTOR: rules
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: alembic upgrade head
      - run: python -m scripts.smoke
      - run: alembic check
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api web
